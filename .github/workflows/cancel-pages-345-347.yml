name: Cancel only obsolete Pages runs 345 and 347
on:
  push:
    branches: [maintenance/cancel-pages-345-347]
    paths: ['.github/workflows/cancel-pages-345-347.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify exact targets and cancel through official API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base = "https://api.github.com/repos/kongvincent-cyber/ai-daily/actions/runs/"
          targets = {42724516602: (345, "ed780b90651f85db51898653dbd94707451a21c8"), 42755806962: (347, "224ddff2d7037b1039f2bcf395f139e39417c592")}
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def request(run, suffix="", method="GET"):
              req = urllib.request.Request(base + str(run) + suffix, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b"{}")
          for run, (number, sha) in targets.items():
              code, d = request(run)
              assert code == 200 and d["run_number"] == number and d["head_sha"] == sha, "Target verification failed"
              print(json.dumps({"run":run,"before":d["status"],"conclusion":d["conclusion"]}), flush=True)
              if d["status"] == "completed":
                  continue
              for endpoint in ["/cancel", "/force-cancel"]:
                  code, body = request(run, endpoint, "POST")
                  print(json.dumps({"run":run,"operation":endpoint,"http":code,"message":body.get("message")}), flush=True)
                  time.sleep(5)
                  _, d = request(run)
                  if d.get("status") == "completed":
                      break
                  if code in (401,403):
                      break
              print(json.dumps({"run":run,"after":d.get("status"),"conclusion":d.get("conclusion")}), flush=True)
          PY
